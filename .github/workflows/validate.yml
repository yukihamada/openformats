name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Unit tests (JCS / Ed25519 / hash / chain / migration)
        run: python3 tests/test_core.py
      - name: Validate every sample and catalog against its schema
        run: python3 tools/validate.py --all
      - name: Verify content_hash, signatures and hash_chain on all data
        run: |
          set -e
          fail=0
          for f in $(find examples works products events places -name '*.json'); do
            if ! python3 tools/of.py verify "$f" >/dev/null 2>&1; then
              echo "VERIFY FAILED: $f"; python3 tools/of.py verify "$f"; fail=1
            fi
          done
          exit $fail
