<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="1つの作品が1つのJSON（設計図）になり、音楽・ラジオ・本・声・動画・建築など様々な形へ広がる様子のイラスト">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#fbfbf9"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2f5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5cff"/><stop offset="1" stop-color="#7aa0ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#2b5cff" flood-opacity="0.16"/>
    </filter>
    <filter id="tiny" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="960" height="560" fill="url(#bg)"/>

  <g fill="none" stroke="#2b5cff" stroke-opacity="0.10" stroke-width="1.5">
    <ellipse cx="480" cy="280" rx="340" ry="210"/>
    <ellipse cx="480" cy="280" rx="250" ry="155"/>
  </g>
  <g stroke="#2b5cff" stroke-opacity="0.18" stroke-width="2">
    <path d="M480 280 L214 152"/><path d="M480 280 L746 152"/>
    <path d="M480 280 L196 404"/><path d="M480 280 L764 404"/>
    <path d="M480 280 L480 96"/><path d="M480 280 L480 464"/>
  </g>

  <!-- central JSON document -->
  <g filter="url(#soft)">
    <rect x="392" y="150" width="176" height="260" rx="18" fill="url(#doc)" stroke="#dfe4f5"/>
  </g>
  <g fill="url(#accent)">
    <rect x="414" y="182" width="34" height="8" rx="4"/>
    <rect x="414" y="206" width="118" height="8" rx="4" opacity="0.55"/>
    <rect x="414" y="230" width="96" height="8" rx="4" opacity="0.35"/>
    <rect x="414" y="254" width="118" height="8" rx="4" opacity="0.55"/>
    <rect x="414" y="278" width="72" height="8" rx="4" opacity="0.35"/>
    <rect x="414" y="302" width="104" height="8" rx="4" opacity="0.55"/>
    <rect x="414" y="326" width="34" height="8" rx="4"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M414 176 l-8 6 8 6"/><path d="M546 176 l8 6 -8 6"/>
    <path d="M414 344 l-8 6 8 6"/><path d="M546 344 l8 6 -8 6"/>
  </g>

  <!-- icon-only satellite chips -->
  <g filter="url(#tiny)">
    <circle cx="480" cy="60" r="34" fill="#fff" stroke="#dfe4f5"/>
    <circle cx="480" cy="500" r="34" fill="#fff" stroke="#dfe4f5"/>
    <circle cx="120" cy="150" r="34" fill="#fff" stroke="#dfe4f5"/>
    <circle cx="840" cy="150" r="34" fill="#fff" stroke="#dfe4f5"/>
    <circle cx="100" cy="410" r="34" fill="#fff" stroke="#dfe4f5"/>
    <circle cx="860" cy="410" r="34" fill="#fff" stroke="#dfe4f5"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- mic (voice) -->
    <g transform="translate(480 60)">
      <rect x="-6" y="-16" width="12" height="20" rx="6"/>
      <path d="M-12 0 a12 12 0 0 0 24 0"/><path d="M0 12 v6"/>
    </g>
    <!-- building (bim) -->
    <g transform="translate(480 500)">
      <path d="M-14 14 V-6 l14 -8 14 8 V14 Z"/><path d="M-5 14 V2 h10 V14"/>
    </g>
    <!-- radio waves -->
    <g transform="translate(120 150)">
      <circle cx="0" cy="0" r="4" fill="url(#accent)" stroke="none"/>
      <path d="M-9 -9 a13 13 0 0 1 0 18"/><path d="M9 -9 a13 13 0 0 0 0 18"/>
      <path d="M-15 -15 a21 21 0 0 1 0 30"/><path d="M15 -15 a21 21 0 0 0 0 30"/>
    </g>
    <!-- book -->
    <g transform="translate(840 150)">
      <path d="M-14 -10 h11 a5 5 0 0 1 3 2 a5 5 0 0 1 3 -2 h11 v22 h-11 a5 5 0 0 0 -3 2 a5 5 0 0 0 -3 -2 h-11 Z"/>
      <path d="M0 -8 v22"/>
    </g>
    <!-- film (movie) -->
    <g transform="translate(100 410)">
      <rect x="-16" y="-11" width="32" height="22" rx="3"/>
      <path d="M-16 -4 h32 M-16 4 h32 M-8 -11 v22 M8 -11 v22"/>
    </g>
    <!-- map pin (place) -->
    <g transform="translate(860 410)">
      <path d="M0 16 C-12 2 -14 -4 -14 -9 a14 14 0 0 1 28 0 c0 5 -2 11 -14 25 Z"/>
      <circle cx="0" cy="-9" r="5"/>
    </g>
  </g>

  <g fill="#2b5cff" fill-opacity="0.25">
    <circle cx="330" cy="250" r="5"/><circle cx="640" cy="220" r="4"/>
    <circle cx="360" cy="330" r="4"/><circle cx="620" cy="340" r="5"/>
  </g>
</svg>
